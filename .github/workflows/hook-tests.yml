name: Hook & Mirror Sync CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify cn/ and en/ shared hook files stay byte-identical
        run: python .github/scripts/verify_mirrors.py
      - name: Run guardrail hook test suite (en/)
        if: runner.os == 'Windows'
        run: python en/guardrails/hooks/tests/run_hook_tests.py --require-ps --require-bash
      - name: Run guardrail hook test suite (cn/)
        if: runner.os == 'Windows'
        run: python cn/guardrails/hooks/tests/run_hook_tests.py --require-ps --require-bash
      - name: Run guardrail hook test suite (en/, Unix)
        if: runner.os != 'Windows'
        run: python en/guardrails/hooks/tests/run_hook_tests.py --require-bash
      - name: Run guardrail hook test suite (cn/, Unix)
        if: runner.os != 'Windows'
        run: python cn/guardrails/hooks/tests/run_hook_tests.py --require-bash
      - name: Smoke-test host environment probes (dry-run)
        run: |
          python en/scripts/probe_env.py --dry-run
          python cn/scripts/probe_env.py --dry-run
      - name: Verify 150-trial research dataset & Hook positive controls
        run: python research/scripts/verify_results.py
